<!DOCTYPE html>
<html lang="ja">
<head>
<!-- build 2026-10-22 09:29 JST -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="リンク帳">
<meta name="theme-color" content="#f6f4fa">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>声優出演リンク帳</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap" media="print" onload="this.media='all'">
<style>
:root{
  --bg:#f6f4fa; --surface:#ffffff; --ink:#221d33; --muted:#6d6782; --line:#dcd6ea; --accent:#d6336c;
  --k-video:#3b6fd9; --k-selfie:#d6336c; --k-live:#0f8f7a; --k-other:#7a6a9b;
  --f-display:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#16131f; --surface:#211d2e; --ink:#eeeaf7; --muted:#a39cba; --line:#3a3450; --accent:#ff6b9a;
  --k-video:#7ea2ff; --k-selfie:#ff6b9a; --k-live:#4fd1b5; --k-other:#b9a8de; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 64px;display:grid;gap:16px}
header{display:flex;flex-wrap:wrap;align-items:end;justify-content:space-between;gap:8px}
h1{font-family:var(--f-display);font-weight:400;font-size:clamp(24px,6vw,34px);line-height:1.15;margin:0;letter-spacing:.02em}
.count{font-family:var(--f-mono);color:var(--muted);font-size:13px}
.filters{position:sticky;top:0;z-index:2;background:var(--bg);padding:8px 0 10px;display:grid;gap:8px;border-bottom:1px solid var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips.clamp{max-height:76px;overflow:hidden}
.more{justify-self:start;border:0;background:transparent;color:var(--accent);font:inherit;font-size:12px;padding:0 4px;cursor:pointer}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 13px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.search{display:flex;gap:8px}
input,select{font:inherit;color:inherit;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;font-size:16px;min-width:0}
.search input{flex:1}
.list{display:grid;gap:12px}
.stub{display:grid;grid-template-columns:72px minmax(0,1fr);background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.date{display:grid;place-content:center;text-align:center;padding:10px 4px;border-right:2px dashed var(--line);font-family:var(--f-mono);color:var(--muted);position:relative}
.date b{display:block;font-size:18px;color:var(--ink);line-height:1.1}
.date small{font-size:11px}
.date::before,.date::after{content:"";position:absolute;right:-9px;width:16px;height:16px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.date::before{top:-9px}.date::after{bottom:-9px}
.body{padding:12px 14px;display:grid;gap:5px;min-width:0}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px}
.kind{border-radius:4px;padding:1px 8px;font-weight:700;color:var(--surface);background:var(--k-other)}
.kind[data-k="シャニ配信"]{background:var(--k-video)}
.kind[data-k="声優配信"]{background:var(--k-live)}
.kind[data-k="出演動画"]{background:var(--k-video)}
.kind[data-k="SNS自撮り"]{background:var(--k-selfie)}
.kind[data-k="配信・生放送"]{background:var(--k-live)}
.person{font-weight:700}
.plat{color:var(--muted);font-family:var(--f-mono)}
.title{font-size:16px;font-weight:700;overflow-wrap:anywhere}
.title a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.title a:active,.title a:hover{color:var(--accent);border-color:var(--accent)}
.memo{color:var(--muted);font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.empty{border:2px dashed var(--line);border-radius:14px;padding:28px 20px;text-align:center;color:var(--muted)}
.empty strong{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
/* スマホで横にはみ出さないように固定 */
html,body{max-width:100%;overflow-x:hidden}
.wrap,.filters,.list{grid-template-columns:minmax(0,1fr)}
.wrap>*,.filters>*,.list>*{min-width:0}
.search select{flex:0 0 auto;width:auto}
/* 編集・削除 */
.acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}
.meta .card-acts{margin-left:auto}
.meta .card-acts .btn{padding:1px 10px;font-size:11px}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 13px;font:inherit;font-size:12px;cursor:pointer}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--surface);font-weight:700}
.btn.danger{border-color:var(--accent);color:var(--accent);font-weight:700}
.btn[disabled]{opacity:.5;cursor:default}
.edit{display:grid;gap:8px}
.edit label{display:grid;gap:2px;font-size:11px;color:var(--muted);letter-spacing:.04em;min-width:0}
.edit input,.edit select,.edit textarea{width:100%;font-size:16px;padding:6px 8px}
.edit textarea{font:inherit;font-size:16px;color:inherit;border:1px solid var(--line);background:var(--bg);border-radius:8px;min-height:56px;resize:vertical}
.edit .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.edit .url{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
.note{font-size:12px;color:var(--muted)}
.note.err{color:var(--accent)}
.head-right{display:flex;align-items:center;gap:10px}
.add-btn{font-size:14px;padding:6px 16px}
#addArea{background:var(--surface);border:1px solid var(--accent);border-radius:12px;padding:14px}
#addArea h2{margin:0 0 8px;font-size:15px}
.saved-note{border:1px solid var(--k-live);color:var(--k-live);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:700}
.castpick{margin-top:6px;border:1px solid var(--line);border-radius:10px;background:var(--bg)}
.castpick summary{cursor:pointer;padding:7px 10px;font-size:12px;color:var(--accent);font-weight:700;list-style:none}
.castpick summary::-webkit-details-marker{display:none}
.castpick summary::before{content:"▸ "}
.castpick[open] summary::before{content:"▾ "}
.castpick .units{display:grid;gap:8px;padding:0 10px 10px}
.castpick .unit{display:grid;gap:4px}
.castpick .uname{font-size:11px;color:var(--muted);letter-spacing:.04em}
.castpick .uchips{display:flex;flex-wrap:wrap;gap:5px}
.castpick button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:4px 11px;font:inherit;font-size:13px;cursor:pointer}
.castpick button small{color:var(--muted);font-size:10px;margin-left:3px}
.castpick button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.castpick button[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.tagpick{display:flex;flex-wrap:wrap;gap:5px;margin-top:4px}
.tagpick button{border:1px dashed var(--line);background:transparent;color:var(--muted);border-radius:999px;padding:3px 10px;font:inherit;font-size:12px;cursor:pointer}
.tagpick button[aria-pressed="true"]{border-style:solid;border-color:var(--ink);background:var(--ink);color:var(--bg)}
.thumbs{display:flex;flex-wrap:wrap;gap:6px;max-width:100%}
/* iPhone の Safari でも確実に大きさが決まるよう、高さは padding で作る */
.thumbs .pic{position:relative;display:block;width:96px;max-width:100%;border-radius:8px;overflow:hidden;background:var(--line);cursor:zoom-in;-webkit-tap-highlight-color:transparent}
.thumbs .pic::before{content:"";display:block;padding-top:100%}
.thumbs .pic.wide{width:100%;max-width:200px}
.thumbs .pic.wide::before{padding-top:56.25%}
.thumbs .pic img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;display:block}
.thumbs .pic:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none !important}
.lightbox{position:fixed;inset:0;z-index:10;background:rgba(10,8,16,.92);display:grid;place-items:center;padding:16px}
.lightbox img{max-width:100%;max-height:calc(100vh - 120px);object-fit:contain;border-radius:6px}
.lightbox video{max-width:100%;max-height:calc(100vh - 120px);border-radius:6px;background:#000}
.lightbox .lb-yt{width:min(100%,calc((100vh - 120px) * 16 / 9));aspect-ratio:16/9;height:auto;border:0;border-radius:6px;background:#000}
.lightbox .lb-cap{position:fixed;left:16px;right:16px;top:14px;text-align:center;color:#fff;font-size:13px;opacity:.9;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lightbox .lb-bar button[disabled]{opacity:.3;cursor:default}
.lightbox .lb-note{position:fixed;left:0;right:0;bottom:62px;text-align:center;color:#fff;font-size:13px;opacity:.85}
.lightbox .lb-note:empty{display:none}
.thumbs .pic.play::after{content:"▶";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:34px;height:34px;border-radius:50%;background:rgba(10,8,16,.6);color:#fff;font-size:14px;line-height:34px;text-align:center;padding-left:3px;box-sizing:border-box;pointer-events:none}
.lightbox .lb-bar{position:fixed;left:0;right:0;bottom:16px;display:flex;justify-content:center;gap:10px}
.lightbox .lb-bar button,.lightbox .lb-bar a{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:7px 16px;font:inherit;font-size:13px;text-decoration:none;cursor:pointer}
.add-thumbs{display:flex;gap:6px;flex-wrap:wrap}
.add-thumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px;background:var(--line)}
.search{flex-wrap:wrap}
.search input{flex:1 1 160px}
.search .toggle{flex:0 0 auto}
.grp{border:1px solid var(--line);border-radius:4px;padding:0 7px;color:var(--muted);background:transparent;font:inherit;font-size:12px;cursor:pointer}
.grp:hover{border-color:var(--ink);color:var(--ink)}
.stub.group{border-color:var(--ink)}
.group-head{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px}
.group-head .gname{font-size:17px;font-weight:700}
.group-head .gcount{font-family:var(--f-mono);font-size:12px;color:var(--muted)}
.entries{display:grid;gap:0;border-top:1px dashed var(--line)}
.entry{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.entry .etitle{font-size:14px;font-weight:700;overflow-wrap:anywhere;min-width:0}
.entry .etitle a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.entry .emeta{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;font-size:11px;color:var(--muted)}
.entry .btn{padding:2px 10px;font-size:11px}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 16px;border-radius:999px;font-size:13px;z-index:5;max-width:calc(100% - 32px)}
/* スマホ：左右の枠はないものとして、今までどおり縦1列（題名 → 追加 → 絞り込み → 一覧） */
.side,.main{display:contents}
.wrap>.side>header{order:0}
#addArea{order:1}
.filters{order:2}
.list{order:3}
.side-label,.topbar,.chip .n{display:none}
/* 1件ずつのカードは左の日付欄をなくし、日付はタグの右に（まとめカードは日付欄を残す） */
.stub:not(.group){grid-template-columns:minmax(0,1fr)}
.stub:not(.group)>.date{display:none}
/* PC：左に絞り込み、右に一覧 */
@media (min-width:900px){
  /* スクロールバーが出たり消えたりしても幅が変わらないよう、いつも場所を空けておく */
  html,.side{scrollbar-gutter:stable}
  /* overflow-x:hidden だと body がスクロールの箱扱いになり、左の欄・検索バーが上に貼り付かない。clip なら貼り付く */
  html,body{overflow-x:clip}
  .wrap{max-width:none;padding:0;gap:0;grid-template-columns:260px minmax(0,1fr);align-items:start}
  .side{display:grid;align-content:start;gap:14px;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--surface);border-right:1px solid var(--line);padding:18px 12px 32px}
  .side header{display:grid;gap:8px;padding:0 6px}
  .side h1{font-size:22px}
  .side .head-right{display:grid;gap:8px}
  .side .add-btn{width:100%;white-space:nowrap}
  .filters{position:static;background:transparent;border:0;padding:0;gap:2px}
  .side-label{display:flex;align-items:baseline;gap:6px;width:calc(100% - 12px);margin:10px 6px 2px;padding:4px 0;border:0;background:transparent;font:inherit;font-size:12px;color:var(--muted);letter-spacing:.08em;text-align:left;cursor:pointer}
  .side-label::before{content:"▾";display:inline-block;width:10px}
  .side-label.folded::before{content:"▸"}
  .side-label:hover{color:var(--ink)}
  .side-label .sel{margin-left:auto;color:var(--accent);font-weight:700;letter-spacing:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60%}
  .side-label:first-child{margin-top:0}
  .filters.fold-kind #kindChips,.filters.fold-person #personChips,.filters.fold-group #groupChips{display:none}
  .filters .chips{flex-direction:column;flex-wrap:nowrap;gap:1px}
  .filters .chips.clamp{max-height:none;overflow:visible}
  .filters .more{display:none}
  .filters .chip{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;border:0;background:transparent;border-radius:8px;padding:6px 10px;font-size:14px}
  .filters .chip:hover{background:var(--bg)}
  .filters .chip[aria-pressed="true"]{background:var(--bg);color:var(--accent);font-weight:700}
  .chip .pre{display:none}
  .chip .n{display:inline;margin-left:auto;font-family:var(--f-mono);font-size:11px;color:var(--muted);font-weight:400}
  .main{display:grid;gap:16px;align-content:start;padding:0 28px 64px;min-width:0}
  .main>*{min-width:0;width:100%;max-width:960px}
  .topbar{display:block;position:sticky;top:0;z-index:2;background:var(--bg);padding:14px 0 12px;border-bottom:1px solid var(--line)}
  .topbar .search{flex-wrap:nowrap}
}

/* GitHub Pages 版のみ */
html.needkey .wrap{display:none}
.keyform{max-width:420px;margin:15vh auto 0;padding:0 16px;display:grid;gap:12px}
.keyform h1{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0}
.keyform p{margin:0;color:var(--muted);font-size:14px}
.keyform input{font-size:16px}
html.syncing .count::after{content:"・更新中";color:var(--muted)}
html.offline .count::after{content:"・オフライン（前回の内容）";color:var(--accent)}
</style>
</head>
<body>
<form class="keyform" id="keyForm" hidden>
  <h1>声優出演リンク帳</h1>
  <p id="keyMsg">はじめに合言葉を入力してください（Apps Script の setup を実行したときにログに出た32文字の英数字）。この端末に保存され、次からは入力不要です。</p>
  <input id="keyInput" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="合言葉">
  <button class="btn primary" type="submit">はじめる</button>
</form>
<div class="wrap">
  <aside class="side">
  <header>
    <h1>声優出演リンク帳</h1>
    <div class="head-right">
      <span class="count" id="count"></span>
      <button class="btn primary add-btn" type="button" id="addBtn">＋ 追加</button>
    </div>
  </header>
  <section class="filters" id="filters">
    <button class="side-label" type="button" data-sec="kind">種類</button>
    <div class="chips" id="kindChips"></div>
    <button class="side-label" type="button" data-sec="person">出演者</button>
    <div class="chips" id="personChips"></div>
    <button class="more" type="button" id="personMore" hidden></button>
    <button class="side-label" type="button" data-sec="group" id="groupLabel">まとめ</button>
    <div class="chips" id="groupChips"></div>
    <button class="more" type="button" id="groupMore" hidden></button>
    <div class="search" id="searchRow">
      <button class="chip toggle" type="button" id="groupToggle" aria-pressed="false">まとめて表示</button>
      <input id="q" type="search" placeholder="タイトル・メモ・タグで検索">
      <select id="sort" aria-label="並び順"><option value="desc">新しい順</option><option value="asc">古い順</option></select>
    </div>
  </section>
  </aside>
  <main class="main">
  <div class="topbar" id="searchSlot"></div>
  <section id="addArea" hidden></section>
  <section class="list" id="list"></section>
  </main>
</div>
<div class="toast" id="toast" hidden></div>
<div class="lightbox" id="lightbox" hidden></div>
<script>
(function(){
  const API = "https://script.google.com/macros/s/AKfycbyfh3ZNTmuZ0aYi3lRmqZfzEgsNYxnNwxYUrXcAx10BcJTTgn3J75eeu5SaiTtzyRO21A/exec";
  const KEY_STORE = "linkbook-key", CACHE_STORE = "linkbook-cache";
  const get = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const set = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };
  const del = k => { try { localStorage.removeItem(k); } catch (e) {} };

  // 合言葉：?key= で渡されたら端末に保存して、アドレスバーからは消す
  const qs = new URLSearchParams(location.search);
  let key = get(KEY_STORE) || "";
  if (qs.get("key")) {
    key = qs.get("key").trim();
    set(KEY_STORE, key);
    qs.delete("key");
  }
  const add = /^https?:\/\//.test(qs.get("add") || "") ? qs.get("add") : "";
  qs.delete("add");
  try { history.replaceState(null, "", location.pathname + (qs.toString() ? "?" + qs : "")); } catch (e) {}

  let cache = null;
  try { cache = JSON.parse(get(CACHE_STORE) || "null"); } catch (e) {}
  window.BOOT = { key: key, add: add, rows: cache ? cache.rows : [], readings: cache ? cache.readings : {} };
  window.LINKBOOK_LOADING = true;

  function saveCache(rows, readings){
    const prev = (() => { try { return JSON.parse(get(CACHE_STORE) || "null"); } catch (e) { return null; } })();
    set(CACHE_STORE, JSON.stringify({ rows: rows, readings: readings || (prev && prev.readings) || {}, at: Date.now() }));
  }
  window.LINKBOOK_SAVE_CACHE = saveCache;

  // google.script.run と同じ書き方で Apps Script を呼ぶ
  function runner(ok, ng){
    const r = {
      withSuccessHandler: fn => runner(fn, ng),
      withFailureHandler: fn => runner(ok, fn)
    };
    ["apiAdd", "apiUpdate", "apiDelete", "apiInfo", "apiRefreshImages"].forEach(name => {
      r[name] = (...args) => {
        fetch(API, { method: "POST", body: JSON.stringify({ action: name, key: args[0], args: args.slice(1) }) })
          .then(res => res.json())
          .then(res => { if (res && res.ok && res.rows) saveCache(res.rows); ok && ok(res); })
          .catch(err => { ng && ng(err); });
      };
    });
    return r;
  }
  window.google = { script: { run: runner() } };

  // 最新データを取ってきて差し替える
  window.LINKBOOK_REFRESH = function(){
    document.documentElement.classList.add("syncing");
    fetch(API + "?action=list&key=" + encodeURIComponent(key))
      .then(res => res.json())
      .then(d => {
        window.LINKBOOK_LOADING = false;
        document.documentElement.classList.remove("syncing");
        if (d && d.ok) {
          saveCache(d.rows, d.readings);
          window.__linkbook && window.__linkbook.setData(d.rows, d.readings);
        } else if (d && d.error === "bad_key") {
          del(KEY_STORE); del(CACHE_STORE);
          showKeyForm("合言葉が違うようです。もう一度入力してください。");
        }
      })
      .catch(() => {
        window.LINKBOOK_LOADING = false;
        document.documentElement.classList.remove("syncing");
        document.documentElement.classList.add("offline");
        window.__linkbook && window.__linkbook.render();
      });
  };

  // 合言葉の入力画面
  function showKeyForm(msg){
    document.documentElement.classList.add("needkey");
    const box = document.getElementById("keyForm");
    if (!box) return;
    box.hidden = false;
    if (msg) document.getElementById("keyMsg").textContent = msg;
  }
  window.LINKBOOK_NEED_KEY = !key;
  window.LINKBOOK_SHOW_KEY = showKeyForm;
})();
</script>
<script>
(function(){
  let ROWS = window.BOOT.rows;
  const KEY = window.BOOT.key;
  const ADD_URL = window.BOOT.add;
  let READINGS = window.BOOT.readings;
  // 五十音順（よみが登録されている人を先に、未登録の人は後ろ）
  const sortPeople = names => names.slice().sort((a, b) => {
    const ya = READINGS[a] || "", yb = READINGS[b] || "";
    if (!!ya !== !!yb) return ya ? -1 : 1;
    return (ya || a).localeCompare(yb || b, "ja");
  });
  const KINDS = ["SNS自撮り","シャニ配信","声優配信","その他"];
  const split = v => String(v || "").split(/[、,，]/).map(x => x.trim()).filter(Boolean);
  const ytId = u => (String(u).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|live\/))([\w-]{11})/) || [])[1];
  // X の画像は大きさを指定できる（small / large）
  const twSize = (u, size) => {
    try {
      const x = new URL(u);
      if (x.hostname !== "pbs.twimg.com") return u;
      x.searchParams.set("name", size);
      return x.href;
    } catch (e) { return u; }
  };
  const X_VIDEO_THUMB = /pbs\.twimg\.com\/(ext_tw_video_thumb|amplify_video_thumb|tweet_video_thumb)\//;
  // カードに出す画像：YouTube はサムネイル、それ以外は保存した画像URL
  const pics = r => {
    const id = ytId(r.url);
    if (id) return [{ thumb: "https://i.ytimg.com/vi/" + id + "/mqdefault.jpg", full: "https://i.ytimg.com/vi/" + id + "/hqdefault.jpg", wide: true, yt: id, src: r.url }];
    const list = String(r.images || "").split(/\s+/).filter(u => /^https:\/\//.test(u) && !/static\.cdninstagram\.com|\/rsrc\.php\//.test(u));
    // 出演動画・配信のサムネイル（1枚だけのもの）は横長で表示
    const wide = list.length === 1 && (r.kind === "出演動画" || r.kind === "配信・生放送");
    // X の動画・GIF のサムネイルは、拡大表示で動画を流す
    return list.map(u => ({ thumb: twSize(u, "small"), full: twSize(u, "large"), wide: wide, row: r.row, src: r.url, xvideo: X_VIDEO_THUMB.test(u) }));
  };
  const prep = () => ROWS.forEach(r => { r.people = split(r.person); r.pics = pics(r); r.group = String(r.group || "").trim(); });
  prep();
  const $ = id => document.getElementById(id);
  const state = {kind:"すべて", person:"すべて", group:"すべて", grouped:false, q:"", sort:"desc"};
  try { Object.assign(state, JSON.parse(localStorage.getItem("seiyu-filter") || "{}")); } catch(e) {}
  const save = () => { try { localStorage.setItem("seiyu-filter", JSON.stringify(state)); } catch(e) {} };
  $("q").value = state.q; $("sort").value = state.sort;
  let editingRow = null;

  function el(tag, attrs, ...kids){
    const n = document.createElement(tag);
    for (const k in attrs || {}) { if (k === "text") n.textContent = attrs[k]; else if (k === "class") n.className = attrs[k]; else n.setAttribute(k, attrs[k]); }
    kids.forEach(c => c && n.append(c));
    return n;
  }
  function safeUrl(u){ try { const x = new URL(u); return /^https?:$/.test(x.protocol) ? x.href : "#"; } catch(e) { return "#"; } }
  // pre：ラベルの前置き（PC では小見出しがあるので隠す）、n：件数（PC だけ表示）
  function chip(label, active, fn, pre, n){
    const b = el("button", {class:"chip", type:"button", "aria-pressed":String(active)});
    if (pre) b.append(el("span", {class:"pre", text:pre}));
    b.append(label);
    if (n != null) b.append(el("small", {class:"n", text:String(n)}));
    b.onclick = fn; return b;
  }
  // PC（横幅900px以上）では検索欄を右側の上へ、スマホでは絞り込みの最後へ
  const wide = matchMedia("(min-width:900px)");
  let wasWide = wide.matches;
  const placeSearch = () => (wide.matches ? $("searchSlot") : $("filters")).append($("searchRow"));
  placeSearch();
  addEventListener("resize", () => { if (wide.matches === wasWide) return; wasWide = wide.matches; placeSearch(); render(); });
  // PC の左の欄：見出しを押すと折りたたむ（端末に覚えておく）
  const folded = {};
  try { Object.assign(folded, JSON.parse(localStorage.getItem("seiyu-fold") || "{}")); } catch(e) {}
  const SEC_NAMES = {kind:"種類", person:"出演者", group:"まとめ"};
  function sideLabels(){
    document.querySelectorAll(".side-label").forEach(b => {
      const sec = b.dataset.sec;
      $("filters").classList.toggle("fold-" + sec, !!folded[sec]);
      b.classList.toggle("folded", !!folded[sec]);
      b.setAttribute("aria-expanded", String(!folded[sec]));
      // たたんでいても、選んでいるものが分かるように見出しの右に出す
      b.replaceChildren(SEC_NAMES[sec]);
      if (state[sec] !== "すべて") b.append(el("span", {class:"sel", text:state[sec]}));
      b.onclick = () => { folded[sec] = !folded[sec]; try { localStorage.setItem("seiyu-fold", JSON.stringify(folded)); } catch(e) {} sideLabels(); };
    });
  }
  let toastTimer;
  function toast(t){ const n = $("toast"); n.textContent = t; n.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => n.hidden = true, 2500); }

  // サーバー（Apps Script）を呼ぶ
  function call(fn, args, onDone, onFail){
    const runner = google.script.run
      .withSuccessHandler(res => {
        if (res && res.ok) { ROWS = res.rows; prep(); onDone && onDone(); render(); }
        else {
          const msg = res && res.error === "moved" ? "スプレッドシート側で行が動いたようです。ページを開き直してください"
                    : res && res.error === "bad_key" ? "合言葉が違うため変更できません"
                    : "変更できませんでした";
          onFail && onFail(msg);
        }
      })
      .withFailureHandler(() => onFail && onFail("通信に失敗しました。もう一度お試しください"));
    runner[fn].apply(runner, [KEY].concat(args));
  }

  function render(){
    const kc = $("kindChips"); kc.replaceChildren();
    const kindsInUse = KINDS.concat([...new Set(ROWS.map(r => r.kind).filter(k => k && !KINDS.includes(k)))]);
    const cnt = {kind:{}, person:{}, group:{}};
    ROWS.forEach(r => {
      cnt.kind[r.kind] = (cnt.kind[r.kind] || 0) + 1;
      r.people.forEach(p => cnt.person[p] = (cnt.person[p] || 0) + 1);
      if (r.group) cnt.group[r.group] = (cnt.group[r.group] || 0) + 1;
    });
    ["すべて", ...kindsInUse].forEach(k => kc.append(chip(k, state.kind === k, () => { state.kind = k; save(); render(); }, "", k === "すべて" ? ROWS.length : cnt.kind[k] || 0)));
    const people = sortPeople([...new Set([].concat(...ROWS.map(r => r.people)))]);
    if (state.person !== "すべて" && !people.includes(state.person)) state.person = "すべて";
    const pc = $("personChips"); pc.replaceChildren();
    if (people.length) ["すべて", ...people].forEach(p => pc.append(chip(p, state.person === p, () => { state.person = p; save(); render(); }, p === "すべて" ? "出演者：" : "", p === "すべて" ? ROWS.length : cnt.person[p])));
    const groups = allGroups();
    if (state.group !== "すべて" && !groups.includes(state.group)) state.group = "すべて";
    const gc = $("groupChips"); gc.replaceChildren();
    if (groups.length) ["すべて", ...groups].forEach(g => gc.append(chip(g, state.group === g, () => { state.group = g; save(); render(); }, g === "すべて" ? "まとめ：" : "", g === "すべて" ? ROWS.length : cnt.group[g])));
    gc.hidden = !groups.length;
    $("groupLabel").hidden = !groups.length;
    sideLabels();
    $("groupToggle").setAttribute("aria-pressed", String(state.grouped));
    clampRow("personChips", "personMore", "people");
    clampRow("groupChips", "groupMore", "groups");

    const q = state.q.trim().toLowerCase();
    const rows = ROWS.filter(r =>
      r.row === editingRow || (
      (state.kind === "すべて" || r.kind === state.kind) &&
      (state.person === "すべて" || r.people.includes(state.person)) &&
      (state.group === "すべて" || r.group === state.group) &&
      (!q || [r.title, r.memo, r.person, r.tags, r.url, r.service, r.group].join(" ").toLowerCase().includes(q)))
    ).sort((a,b) => {
      const c = (a.date || a.created).localeCompare(b.date || b.created) || a.row - b.row;
      return state.sort === "asc" ? c : -c;
    });

    $("count").textContent = ROWS.length ? rows.length + " / " + ROWS.length + " 件" : "0 件";
    const list = $("list"); list.replaceChildren();
    if (!ROWS.length && window.LINKBOOK_LOADING) { list.append(el("div", {class:"empty"}, el("strong", {text:"読み込んでいます…"}), document.createTextNode("少しお待ちください。"))); return; }
    if (!ROWS.length) { list.append(el("div", {class:"empty"}, el("strong", {text:"まだリンクがありません"}), document.createTextNode("Chrome で保存したリンクがここに並びます。"))); return; }
    if (!rows.length) { list.append(el("div", {class:"empty"}, el("strong", {text:"条件に合うリンクがありません"}), document.createTextNode("絞り込みや検索語を変えてみてください。"))); return; }
    if (!state.grouped) { rows.forEach(r => list.append(r.row === editingRow ? editor(r) : stub(r))); return; }

    // まとめて表示：同じまとめ名の投稿を1枚のカードに（並び順は先頭の投稿の位置）
    const items = [], byName = new Map();
    rows.forEach(r => {
      if (r.group && r.row !== editingRow) {
        if (!byName.has(r.group)) { const it = { name: r.group, entries: [] }; byName.set(r.group, it); items.push(it); }
        byName.get(r.group).entries.push(r);
      } else items.push({ one: r });
    });
    items.forEach(it => {
      if (it.one) list.append(it.one.row === editingRow ? editor(it.one) : stub(it.one));
      else if (it.entries.length === 1) list.append(stub(it.entries[0]));
      else list.append(groupCard(it.name, it.entries));
    });
  }

  // 出演者・まとめのボタンが多いときは2行までにして「すべて表示」で広げる
  const opened = { people: false, groups: false };
  function clampRow(rowId, btnId, key){
    const row = $(rowId), btn = $(btnId);
    row.classList.remove("clamp");
    btn.hidden = true;
    if (wide.matches || row.hidden || !row.children.length) return;
    row.classList.add("clamp");
    const overflow = row.scrollHeight > row.clientHeight + 2;
    if (!overflow) { row.classList.remove("clamp"); return; }
    if (opened[key]) row.classList.remove("clamp");
    btn.hidden = false;
    btn.textContent = opened[key] ? "たたむ ▴" : "すべて表示 ▾";
    btn.onclick = () => { opened[key] = !opened[key]; clampRow(rowId, btnId, key); };
  }

  function allGroups(){
    const last = {};
    ROWS.forEach(r => { if (!r.group) return; const d = r.date || r.created; if (!last[r.group] || d > last[r.group]) last[r.group] = d; });
    return Object.keys(last).sort((a, b) => (last[b] > last[a] ? 1 : last[b] < last[a] ? -1 : 0));
  }

  function groupCard(name, entries){
    const dates = entries.map(e => e.date).filter(Boolean).sort();
    const first = { date: dates.length ? (state.sort === "asc" ? dates[0] : dates[dates.length - 1]) : "" };
    const people = [...new Set([].concat(...entries.map(e => e.people)))];
    const kinds = [...new Set(entries.map(e => e.kind || "その他"))];

    const head = el("div", {class:"group-head"}, el("span", {class:"gname", text:name}), el("span", {class:"gcount", text:entries.length + " 件"}));
    const meta = el("div", {class:"meta"});
    kinds.forEach(k => meta.append(el("span", {class:"kind", "data-k":k, text:k})));
    people.forEach(p => meta.append(el("span", {class:"person", text:p})));
    const body = el("div", {class:"body"}, head, meta);

    if (entries.some(e => e.pics.length)) {
      const box = el("div", {class:"thumbs"});
      entries.forEach(e => e.pics.forEach(p => box.append(thumbEl(p, e))));
      body.append(box);
    }

    const list = el("div", {class:"entries"});
    entries.forEach(e => {
      const edit = el("button", {class:"btn", type:"button", text:"編集"});
      edit.onclick = () => { editingRow = e.row; render(); };
      const emeta = el("div", {class:"emeta"});
      if (e.date) emeta.append(el("span", {text:e.date.replace(/-/g, "/")}));
      if (e.person) emeta.append(el("span", {text:e.people.join("・")}));
      if (e.service) emeta.append(el("span", {text:e.service}));
      list.append(el("div", {class:"entry"}, el("div", {class:"etitle"}, el("a", {href:safeUrl(e.url), target:"_blank", rel:"noopener", text:e.title || e.url})), edit, emeta));
    });
    body.append(list);
    return el("article", {class:"stub group"}, dateCol(first), body);
  }

  function dateCol(r){
    const d = (r.date || "").split("-");
    const date = el("div", {class:"date"});
    if (d.length === 3) date.append(el("small", {text:d[0]}), el("b", {text: (+d[1]) + "/" + (+d[2])}));
    else date.append(el("small", {text:"日付なし"}));
    return date;
  }

  function stub(r){
    const meta = el("div", {class:"meta"}, el("span", {class:"kind", "data-k":r.kind, text:r.kind || "その他"}));
    r.people.forEach(p => meta.append(el("span", {class:"person", text:p})));
    if (r.service) meta.append(el("span", {class:"plat", text:r.service}));
    (r.tags || "").split(/\s+/).filter(Boolean).forEach(t => meta.append(el("span", {class:"plat", text:"#" + t})));
    // 左の日付欄の代わりに、タグの右に日付を出す
    if (r.date) meta.append(el("span", {class:"plat mdate", text:r.date.replace(/-/g, "/")}));
    if (r.group) {
      const g = el("button", {class:"grp", type:"button", text:"まとめ：" + r.group, title:"このまとめだけ表示"});
      g.onclick = () => { state.group = r.group; save(); render(); };
      meta.append(g);
    }
    const body = el("div", {class:"body"}, meta, el("div", {class:"title"}, el("a", {href:safeUrl(r.url), target:"_blank", rel:"noopener", text:r.title || r.url})));
    if (r.pics.length) {
      const box = el("div", {class:"thumbs"});
      r.pics.forEach(p => box.append(thumbEl(p, r)));
      body.append(box);
    }
    if (r.memo) body.append(el("div", {class:"memo", text:r.memo}));

    const edit = el("button", {class:"btn", type:"button", text:"編集"});
    edit.onclick = () => { editingRow = r.row; render(); };
    const del = el("button", {class:"btn", type:"button", text:"削除"});
    let armed = null;
    del.onclick = () => {
      if (!armed) {
        del.textContent = "もう一度押すと削除"; del.classList.add("danger");
        armed = setTimeout(() => { armed = null; del.textContent = "削除"; del.classList.remove("danger"); }, 4000);
        return;
      }
      clearTimeout(armed); del.disabled = true; edit.disabled = true; del.textContent = "削除しています…";
      call("apiDelete", [r.row, r.url], () => toast("削除しました"), msg => { toast(msg); del.disabled = false; edit.disabled = false; del.textContent = "削除"; del.classList.remove("danger"); armed = null; });
    };
    meta.append(el("div", {class:"acts card-acts"}, edit, del));   // 編集・削除は1行目の右端に（写真の下に余白を作らない）
    return el("article", {class:"stub"}, dateCol(r), body);
  }

  function editor(r){
    const id = s => "e-" + s;
    const title = el("input", {type:"text", id:id("title")}); title.value = r.title;
    const people = el("input", {type:"text", id:id("people"), placeholder:"名前A、名前B"}); people.value = r.people.join("、");
    const kind = el("select", {id:id("kind")}); (KINDS.includes(r.kind) || !r.kind ? KINDS : KINDS.concat(r.kind)).forEach(k => { const o = el("option", {text:k}); if (k === r.kind) o.selected = true; kind.append(o); });
    const date = el("input", {type:"date", id:id("date")}); date.value = /^\d{4}-\d{2}-\d{2}$/.test(r.date) ? r.date : "";
    const tags = el("input", {type:"text", id:id("tags"), placeholder:"スペース区切り"}); tags.value = r.tags;
    const memo = el("textarea", {id:id("memo")}); memo.value = r.memo;
    const group = el("input", {type:"text", id:id("group"), placeholder:"例：MSP day1"}); group.value = r.group;
    const note = el("div", {class:"note"});
    const saveBtn = el("button", {class:"btn primary", type:"submit", text:"保存"});
    const cancel = el("button", {class:"btn", type:"button", text:"キャンセル"});
    cancel.onclick = () => { editingRow = null; render(); };

    const form = el("form", {class:"edit"},
      el("label", {text:"タイトル"}, title),
      el("div", {class:"url", text:r.url}),
      el("label", {text:"出演者（「、」区切り）"}, people),
      castPicker(people),
      el("div", {class:"two"}, el("label", {text:"種類"}, kind), el("label", {text:"日付"}, date)),
      el("label", {text:"タグ（下の候補をタップで追加）"}, tags, tagPicker(tags)),
      el("label", {text:"まとめ（同じイベントなどを1つにまとめる名前。空欄でも可）"}, group, groupPicker(group)),
      el("label", {text:"メモ"}, memo),
      el("div", {class:"acts"}, cancel, saveBtn),
      note
    );
    form.addEventListener("submit", ev => {
      ev.preventDefault();
      saveBtn.disabled = true; cancel.disabled = true; note.className = "note"; note.textContent = "保存しています…";
      const data = { title: title.value.trim(), person: split(people.value).join("、"), kind: kind.value, date: date.value, tags: tags.value.trim().split(/[\s　]+/).filter(Boolean).join(" "), memo: memo.value.trim(), group: group.value.trim() };
      call("apiUpdate", [r.row, r.url, data], () => { editingRow = null; toast("保存しました"); }, msg => { note.className = "note err"; note.textContent = msg; saveBtn.disabled = false; cancel.disabled = false; });
    });
    return el("article", {class:"stub"}, dateCol(r), el("div", {class:"body"}, form));
  }

  // 画像が表示できなかった（期限切れなど）ときは、元の投稿から取り直す（1ページ表示につき1行1回まで）
  const refreshed = new Set();
  function refreshImages(row, url){
    if (refreshed.has(row)) return;
    refreshed.add(row);
    google.script.run
      .withSuccessHandler(res => { if (res && res.ok) { ROWS = res.rows; prep(); render(); } })
      .withFailureHandler(() => {})
      .apiRefreshImages(KEY, row, url);
  }

  // サムネイル1枚分（タップで拡大）。r はその画像の投稿
  function thumbEl(p, r){
    const img = el("img", {src:p.thumb, alt:"", referrerpolicy:"no-referrer", decoding:"async"});
    const video = p.yt || p.xvideo;
    const b = el("div", {class:"pic" + (p.wide ? " wide" : "") + (video ? " play" : ""), role:"button", tabindex:"0", "aria-label":video ? "動画を再生" : "画像を大きく表示"}, img);
    img.onerror = () => { b.remove(); if (p.row) refreshImages(p.row, p.src); };
    b.addEventListener("keydown", e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); b.click(); } });
    b.lbItem = { p: p, r: r };
    b.onclick = () => openLightbox(b);
    return b;
  }

  // ---------- 画像の拡大表示 ----------
  // 一覧に今出ているサムネイルを上から順にたどる（投稿をまたいで前後へ移れる）
  let lbNav = null;
  function openLightbox(start){
    const lb = $("lightbox");
    const items = [...document.querySelectorAll("#list .pic")].map(x => x.lbItem).filter(Boolean);
    let i = Math.max(0, items.indexOf(start.lbItem));
    let shown = 0;
    const go = d => { const j = i + d; if (j < 0 || j >= items.length) return; i = j; draw(); };
    lbNav = go;
    const draw = () => {
      const { p, r } = items[i];
      const now = ++shown;
      let img = el("img", {src:p.full, alt:"", referrerpolicy:"no-referrer"});
      img.onerror = () => { if (img.src !== p.thumb) img.src = p.thumb; };
      // 画像の左半分を押すと前、右半分で次（矢印のカーソルで示す）
      const side = e => { const b = img.getBoundingClientRect(); return e.clientX < b.left + b.width / 2 ? -1 : 1; };
      img.onmousemove = e => { const d = side(e); img.style.cursor = (d < 0 ? i > 0 : i < items.length - 1) ? (d < 0 ? "w-resize" : "e-resize") : "default"; };
      img.onclick = e => { e.stopPropagation(); go(side(e)); };
      const note = el("div", {class:"lb-note"});
      if (p.yt) {
        img = el("iframe", {class:"lb-yt", src:"https://www.youtube-nocookie.com/embed/" + p.yt + "?autoplay=1&playsinline=1", allow:"autoplay; encrypted-media; fullscreen; picture-in-picture", allowfullscreen:"", referrerpolicy:"strict-origin-when-cross-origin", title:"YouTube"});
      } else if (p.xvideo) {
        note.textContent = "動画を読み込んでいます…";
        xVideo(r.url, p.full).then(v => {
          if (now !== shown || lb.hidden) return;
          const video = el("video", {src:v.url, poster:p.full, controls:"", autoplay:"", playsinline:""});
          if (v.gif) { video.muted = true; video.loop = true; }
          img.replaceWith(video);
          note.remove();
        }).catch(() => { if (now === shown) note.textContent = "動画を読み込めませんでした。「元の投稿を開く」で見てください"; });
      }
      // 上：どの投稿の画像か（同じ投稿に複数あるときは何枚目か）
      const k = r.pics.indexOf(p);
      const cap = el("div", {class:"lb-cap", text:(r.person ? r.people.join("・") + "　" : "") + (r.title || r.url) + (r.pics.length > 1 ? "（" + (k + 1) + " / " + r.pics.length + "）" : "")});
      const bar = el("div", {class:"lb-bar"});
      const prev = el("button", {type:"button", text:"‹ 前"}); prev.onclick = e => { e.stopPropagation(); go(-1); };
      const next = el("button", {type:"button", text:"次 ›"}); next.onclick = e => { e.stopPropagation(); go(1); };
      prev.disabled = i === 0; next.disabled = i === items.length - 1;
      const orig = el("a", {href:safeUrl(r.url), target:"_blank", rel:"noopener", text:"元の投稿を開く"});
      orig.onclick = e => e.stopPropagation();
      const close = el("button", {type:"button", text:"閉じる"});
      bar.append(prev, orig, close, next);
      lb.replaceChildren(cap, img, note, bar);
    };
    lb.onclick = e => { if (e.target === lb || e.target.textContent === "閉じる") closeLightbox(); };
    draw();
    lb.hidden = false;
  }
  function closeLightbox(){ lbNav = null; $("lightbox").hidden = true; $("lightbox").replaceChildren(); }
  // スマホ：左右にスワイプで前後へ
  let sx = null, sy = 0;
  $("lightbox").addEventListener("touchstart", e => { if (e.touches.length === 1) { sx = e.touches[0].clientX; sy = e.touches[0].clientY; } else sx = null; }, {passive:true});
  $("lightbox").addEventListener("touchend", e => {
    if (sx === null || !lbNav) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    sx = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.5) lbNav(dx < 0 ? 1 : -1);
  });
  // Esc で閉じる、← → で前後へ
  document.addEventListener("keydown", e => {
    if ($("lightbox").hidden) return;
    if (e.key === "Escape") closeLightbox();
    else if (e.key === "ArrowLeft" && lbNav) lbNav(-1);
    else if (e.key === "ArrowRight" && lbNav) lbNav(1);
  });

  // X の動画の mp4 を FxTwitter から取る（サムネイルが一致するもの。1本だけならそれ）
  function xVideo(url, thumb){
    const id = (String(url).match(/\/status\/(\d+)/) || [])[1];
    if (!id) return Promise.reject();
    const key = u => String(u || "").replace(/[?#].*$/, "").replace(/\.\w+$/, "");
    return fetch("https://api.fxtwitter.com/status/" + id).then(res => res.json()).then(j => {
      const vids = ((j.tweet && j.tweet.media && j.tweet.media.videos) || []).filter(v => /^https:\/\//.test(v.url || ""));
      const v = vids.find(v => key(v.thumbnail_url) === key(thumb)) || (vids.length === 1 ? vids[0] : null);
      if (!v) throw new Error("no video");
      return { url: v.url, gif: v.type === "gif" };
    });
  }

  // ---------- タグ候補（過去に使ったタグをタップで出し入れ） ----------
  function allTags(){
    const n = {};
    ROWS.forEach(r => String(r.tags || "").split(/\s+/).filter(Boolean).forEach(t => { n[t] = (n[t] || 0) + 1; }));
    return Object.keys(n).sort((a, b) => n[b] - n[a] || a.localeCompare(b, "ja"));
  }
  // 登録済みの名前がテキスト内に出てくるか探す（出演者の自動入力用）
  function findPeople(text, known){
    const squash = v => String(v || "").replace(/[\s\u3000・]/g, "");
    const t = squash(text);
    if (!t) return [];
    const taken = [], hits = [];
    known.filter(n => squash(n).length >= 2).sort((a, b) => squash(b).length - squash(a).length).forEach(name => {
      const n = squash(name);
      let i = t.indexOf(n);
      while (i >= 0) {
        const end = i + n.length;
        if (!taken.some(([s0, e0]) => i < e0 && end > s0)) { taken.push([i, end]); hits.push([i, name]); return; }
        i = t.indexOf(n, i + 1);
      }
    });
    return hits.sort((a, b) => a[0] - b[0]).map(h => h[1]);
  }

  // 種類の自動判定。SNS は URL だけで決まる。動画・配信サイトはチャンネル名やタイトルで
  // シャニ公式っぽければ「シャニ配信」、それ以外は「声優配信」。
  const SNS_HOST = /^(x|twitter)\.com$|instagram\.com$|tiktok\.com$|bsky\.app$|threads\.(net|com)$/;
  const VIDEO_HOST = /youtube\.com$|youtu\.be$|nicovideo\.jp$|nico\.ms$|bilibili\.com$|^b23\.tv$|twitch\.tv$|showroom-live\.com$|openrec\.tv$|twitcasting\.tv$/;
  const SHANI_WORDS = /シャニ|シャイニーカラーズ|アイドルマスター|アイマス|IDOLM@STER|idolmaster|偶像大师|283プロ|283PRO/i;
  function hostOf(u){ try { return new URL(String(u)).hostname.replace(/^(www|m|mobile|live)\./, ""); } catch (e) { return ""; } }
  function kindForUrl(u){
    const h = hostOf(u);
    if (SNS_HOST.test(h)) return "SNS自撮り";
    return null;
  }
  function kindFromInfo(u, title, author){
    const h = hostOf(u);
    if (SNS_HOST.test(h)) return "SNS自撮り";
    if (!VIDEO_HOST.test(h)) return null;
    return SHANI_WORDS.test(String(author || "") + " " + String(title || "")) ? "シャニ配信" : "声優配信";
  }

  // シャニのキャスト（ユニット別）。タップで出演者欄に出し入れ
  const CAST = [
    ["イルミネーションスターズ", [["関根瞳","真乃"],["近藤玲奈","灯織"],["峯田茉優","めぐる"]]],
    ["アンティーカ", [["礒部花凜","恋鐘"],["菅沼千紗","摩美々"],["八巻アンナ","咲耶"],["希水しお","結華"],["結名美月","霧子"]]],
    ["放課後クライマックスガールズ", [["河野ひより","果穂"],["白石晴香","智代子"],["永井真里子","樹里"],["丸岡和佳奈","凛世"],["涼本あきほ","夏葉"]]],
    ["アルストロメリア", [["黒木ほの香","甘奈"],["前川涼子","甜花"],["芝崎典子","千雪"]]],
    ["ストレイライト", [["田中有紀","あさひ"],["幸村恵理","冬優子"],["北原沙弥香","愛依"]]],
    ["ノクチル", [["和久井優","透"],["土屋李央","円香"],["田嶌紗蘭","小糸"],["岡咲美保","雛菜"]]],
    ["シーズ", [["紫月杏朱彩","にちか"],["山根綺","美琴"]]],
    ["コメティック", [["川口莉奈","ルカ"],["三川華月","羽那"],["小澤麗那","はるき"]]]
  ];
  function castPicker(input){
    const box = el("details", {class:"castpick"});
    box.append(el("summary", {text:"シャニのキャストから選ぶ"}));
    const units = el("div", {class:"units"});
    box.append(units);
    const current = () => split(input.value);
    const btns = [];
    CAST.forEach(([unit, members]) => {
      const row = el("div", {class:"uchips"});
      members.forEach(([name, chara]) => {
        const b = el("button", {type:"button", "aria-pressed":"false"}, document.createTextNode(name), el("small", {text:chara}));
        b.onclick = () => {
          const now = current();
          input.value = (now.includes(name) ? now.filter(x => x !== name) : now.concat(name)).join("、");
          input.dispatchEvent(new Event("input", {bubbles:true}));
          draw();
        };
        btns.push([name, b]);
        row.append(b);
      });
      units.append(el("div", {class:"unit"}, el("div", {class:"uname", text:unit}), row));
    });
    const draw = () => { const cur = current(); btns.forEach(([n, b]) => b.setAttribute("aria-pressed", String(cur.includes(n)))); };
    input.addEventListener("input", draw);
    input.addEventListener("castsync", draw);   // 自動入力などで値が変わったとき
    draw();
    return box;
  }

  function groupPicker(input){
    const box = el("div", {class:"tagpick"});
    const draw = () => {
      box.replaceChildren();
      const cur = input.value.trim();
      allGroups().slice(0, 12).forEach(g => {
        const b = el("button", {type:"button", "aria-pressed":String(cur === g), text:g});
        b.onclick = () => { input.value = cur === g ? "" : g; draw(); };
        box.append(b);
      });
    };
    input.addEventListener("input", draw);
    draw();
    return box;
  }

  function tagPicker(input){
    const box = el("div", {class:"tagpick"});
    const current = () => input.value.trim().split(/[\s　]+/).map(t => t.replace(/^#/, "")).filter(Boolean);
    const draw = () => {
      box.replaceChildren();
      const cur = current();
      allTags().forEach(t => {
        const b = el("button", {type:"button", "aria-pressed":String(cur.includes(t)), text:"#" + t});
        b.onclick = () => {
          const now = current();
          input.value = (now.includes(t) ? now.filter(x => x !== t) : now.concat(t)).join(" ");
          draw();
        };
        box.append(b);
      });
    };
    input.addEventListener("input", draw);
    draw();
    return box;
  }

  // ---------- 追加フォーム ----------
  function today(){ const d = new Date(); const p = n => String(n).padStart(2, "0"); return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()); }
  function normalize(u){
    try {
      let s = String(u).trim().replace(/#.*$/, "");
      const yt = s.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|live\/))([\w-]{11})/);
      if (yt) return "youtube:" + yt[1];
      s = s.replace(/^https?:\/\/(www\.|mobile\.|m\.)?/, "").replace(/^twitter\.com/, "x.com");
      s = s.replace(/^(x\.com\/[^/]+\/status\/\d+).*$/, "$1");
      s = s.replace(/[?&](utm_[^&]+|s=\d+|t=[^&]+|igsh=[^&]+)/g, "").replace(/\?$/, "").replace(/\/$/, "");
      return s.toLowerCase();
    } catch (e) { return String(u); }
  }

  function openAdd(prefillUrl){
    const area = $("addArea");
    let lastPeople = "", lastKind = "出演動画";
    try { lastPeople = localStorage.getItem("seiyu-last-people") || ""; lastKind = localStorage.getItem("seiyu-last-kind") || "出演動画"; } catch(e) {}
    const url = el("input", {type:"url", id:"a-url", placeholder:"https://… を貼り付け", inputmode:"url"});
    const title = el("input", {type:"text", id:"a-title"});
    const people = el("input", {type:"text", id:"a-people", placeholder:"名前A、名前B", list:"a-people-list"});
    const plist = el("datalist", {id:"a-people-list"});
    [...new Set([].concat(...ROWS.map(r => r.people)))].forEach(p => plist.append(el("option", {value:p})));
    people.value = lastPeople;
    const kind = el("select", {id:"a-kind"}); KINDS.forEach(k => { const o = el("option", {text:k}); if (k === (KINDS.includes(lastKind) ? lastKind : "SNS自撮り")) o.selected = true; kind.append(o); });
    let kindTouched = false;
    kind.addEventListener("change", () => { kindTouched = true; });
    // URLを入れたら種類を自動で選ぶ（自分で選び直したらそちらを優先）
    const autoKind = () => { if (kindTouched) return; const k = kindForUrl(url.value.trim()); if (k) kind.value = k; };
    const date = el("input", {type:"date", id:"a-date"}); date.value = today();
    const tags = el("input", {type:"text", id:"a-tags", placeholder:"スペース区切り"});
    const group = el("input", {type:"text", id:"a-group", placeholder:"例：MSP day1"});
    const memo = el("textarea", {id:"a-memo"});
    const saved = el("div", {class:"saved-note"}); saved.hidden = true;
    const note = el("div", {class:"note"});
    const saveBtn = el("button", {class:"btn primary", type:"submit", text:"保存"});
    const cancel = el("button", {class:"btn", type:"button", text:"閉じる"});
    let force = false, lookedUp = "", images = [], peopleTouched = false;
    const peopleNote = el("div", {class:"note"}); peopleNote.hidden = true;
    people.addEventListener("input", () => { peopleTouched = true; peopleNote.hidden = true; });
    const thumbsBox = el("div", {class:"add-thumbs"});

    cancel.onclick = () => { area.hidden = true; area.replaceChildren(); };

    function checkDup(){
      const hit = ROWS.find(r => normalize(r.url) === normalize(url.value));
      force = !!hit;
      saved.hidden = !hit;
      if (hit) saved.textContent = "✓ 登録済みです（" + (hit.person || "出演者なし") + " / " + (hit.date || "日付なし") + "）";
      saveBtn.textContent = hit ? "重複して保存" : "保存";
    }
    function lookup(){
      const u = url.value.trim();
      checkDup();
      autoKind();
      if (!/^https?:\/\//.test(u) || u === lookedUp) return;
      lookedUp = u;
      images = []; thumbsBox.replaceChildren();
      note.className = "note"; note.textContent = "タイトルと日付を取得しています…";
      google.script.run.withSuccessHandler(info => {
        if (url.value.trim() !== u) return;
        note.textContent = "";
        if (info && info.ok) {
          if (info.title && !title.value.trim()) title.value = info.title;
          if (info.date) date.value = info.date;
          images = Array.isArray(info.images) ? info.images : [];
          if (!kindTouched) { const k = kindFromInfo(u, info.title, info.author); if (k) kind.value = k; }
          if (!peopleTouched) {
            const known = [...new Set([].concat(...ROWS.map(r => r.people)))];
            const found = findPeople([info.title, info.author, info.text].join("\n"), known);
            if (found.length) { people.value = found.join("、"); people.dispatchEvent(new Event("castsync")); peopleNote.textContent = "ページから自動入力しました。違っていたら直してください"; peopleNote.hidden = false; }
          }
          thumbsBox.replaceChildren(...images.map(u => el("img", {src:u, alt:"", referrerpolicy:"no-referrer"})));
        }
      }).withFailureHandler(() => { note.textContent = ""; }).apiInfo(KEY, u);
    }
    url.addEventListener("change", lookup);
    url.addEventListener("paste", () => setTimeout(lookup, 0));
    url.addEventListener("input", () => { checkDup(); autoKind(); });

    const form = el("form", {class:"edit"},
      el("label", {text:"URL"}, url),
      saved,
      el("label", {text:"タイトル（空欄なら自動取得）"}, title),
      thumbsBox,
      el("label", {text:"出演者（「、」区切り）"}, people, plist, peopleNote),
      castPicker(people),
      el("div", {class:"two"}, el("label", {text:"種類"}, kind), el("label", {text:"日付"}, date)),
      el("label", {text:"タグ（下の候補をタップで追加）"}, tags, tagPicker(tags)),
      el("label", {text:"まとめ（空欄でも可）"}, group, groupPicker(group)),
      el("label", {text:"メモ"}, memo),
      el("div", {class:"acts"}, cancel, saveBtn),
      note
    );
    form.addEventListener("submit", ev => {
      ev.preventDefault();
      const u = url.value.trim();
      if (!/^https?:\/\//.test(u)) { note.className = "note err"; note.textContent = "http:// か https:// で始まるURLを入れてください"; return; }
      saveBtn.disabled = true; cancel.disabled = true; note.className = "note"; note.textContent = "保存しています…";
      const data = { url: u, title: title.value.trim(), person: split(people.value).join("、"), kind: kind.value, date: date.value,
                     tags: tags.value.trim().split(/[\s　]+/).filter(Boolean), memo: memo.value.trim(), force: force, images: images, group: group.value.trim() };
      google.script.run.withSuccessHandler(res => {
        saveBtn.disabled = false; cancel.disabled = false;
        if (res && res.ok) {
          try { localStorage.setItem("seiyu-last-people", data.person); localStorage.setItem("seiyu-last-kind", data.kind); } catch(e) {}
          ROWS = res.rows; prep(); area.hidden = true; area.replaceChildren(); render(); toast("追加しました");
        } else if (res && res.error === "duplicate") {
          force = true; saveBtn.textContent = "重複して保存"; note.className = "note err"; note.textContent = "すでに登録されています。もう一度押すと重複して保存します";
        } else {
          note.className = "note err"; note.textContent = res && res.error === "bad_key" ? "合言葉が違うため保存できません" : "保存できませんでした";
        }
      }).withFailureHandler(() => { saveBtn.disabled = false; cancel.disabled = false; note.className = "note err"; note.textContent = "通信に失敗しました。もう一度お試しください"; })
        .apiAdd(KEY, data);
    });

    area.replaceChildren(el("h2", {text:"リンクを追加"}), form);
    area.hidden = false;
    if (prefillUrl) { url.value = prefillUrl; lookup(); people.focus(); }
    else url.focus();
    area.scrollIntoView({block:"start"});
  }
  $("addBtn").addEventListener("click", () => openAdd(""));
  // 外から最新データを差し込むための入口（GitHub Pages 版で使用）
  window.__linkbook = {
    setData(rows, readings){ ROWS = rows; if (readings) READINGS = readings; prep(); render(); },
    render
  };
  if (ADD_URL) openAdd(ADD_URL);

  $("groupToggle").addEventListener("click", () => { state.grouped = !state.grouped; save(); render(); });
  $("q").addEventListener("input", () => { state.q = $("q").value; save(); render(); });
  $("sort").addEventListener("change", () => { state.sort = $("sort").value; save(); render(); });
  render();
})();
</script>
<script>
(function(){
  const form = document.getElementById("keyForm");
  form.addEventListener("submit", e => {
    e.preventDefault();
    const v = document.getElementById("keyInput").value.trim();
    if (!v) return;
    try { localStorage.setItem("linkbook-key", v); } catch (err) {}
    location.reload();
  });
  if (window.LINKBOOK_NEED_KEY) { window.LINKBOOK_SHOW_KEY(); return; }
  window.LINKBOOK_REFRESH();
  // 別のアプリから戻ってきたときも最新にする
  document.addEventListener("visibilitychange", () => { if (!document.hidden) window.LINKBOOK_REFRESH(); });
})();
</script>
